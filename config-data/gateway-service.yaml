
server:
  port: 8081

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      mvc:
        routes: # Aqui se configura las apis de los microservicios
          - id: ms-usuario
            uri: lb://ms-usuario  #lb hace referencia al balanceo de carga
            predicates:
              - Path=/usuario/**
          - id: ms-carro
            uri: lb://ms-carro  #lb hace referencia al balanceo de carga
            predicates:
              - Path=/carro/**
          - id: ms-moto
            uri: lb://ms-moto  #lb hace referencia al balanceo de carga
            predicates:
              - Path=/moto/**